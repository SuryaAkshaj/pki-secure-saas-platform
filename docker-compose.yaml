services:
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - honeypot

  backend:
    build: ./backend
    container_name: saas-backend
    expose:
      - "5000"

  honeypot:
    build: ./honeypot
    container_name: honeypot-service
    expose:
      - "6000"
